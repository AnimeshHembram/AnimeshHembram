name: Update GitHub Activity Radar

on:
  schedule:
    # Update once every day.
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity radar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: AnimeshHembram
        run: |
          set -e

          mkdir -p assets

          python3 <<'PY'
          import json
          import math
          import os
          import subprocess
          from pathlib import Path

          username = os.environ["USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          })

          result = subprocess.run(
              [
                  "curl",
                  "-sS",
                  "-X",
                  "POST",
                  "https://api.github.com/graphql",
                  "-H",
                  "Authorization: bearer " + os.environ["GH_TOKEN"],
                  "-H",
                  "Content-Type: application/json",
                  "-d",
                  payload
              ],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)

          if "errors" in data:
              raise SystemExit(
                  "GitHub GraphQL error: "
                  + json.dumps(data["errors"])
              )

          user = data.get("data", {}).get("user")

          if not user:
              raise SystemExit("Could not retrieve GitHub user data.")

          contributions = user["contributionsCollection"]

          commits = contributions["totalCommitContributions"]
          issues = contributions["totalIssueContributions"]
          pull_requests = contributions["totalPullRequestContributions"]
          reviews = contributions["totalPullRequestReviewContributions"]

          values = {
              "Commits": commits,
              "Pull Requests": pull_requests,
              "Code Reviews": reviews,
              "Issues": issues,
          }

          print("GitHub activity:")
          for key, value in values.items():
              print(f"  {key}: {value}")

          total = sum(values.values())

          if total == 0:
              percentages = {key: 0 for key in values}
          else:
              percentages = {
                  key: round((value / total) * 100)
                  for key, value in values.items()
              }

          # -----------------------------
          # SVG configuration
          # -----------------------------

          width = 900
          height = 560

          center_x = 450
          center_y = 270

          outer_radius = 175
          inner_radius = 18

          axes = [
              ("Commits", commits, percentages["Commits"], -90),
              ("Pull Requests", pull_requests, percentages["Pull Requests"], 0),
              ("Code Reviews", reviews, percentages["Code Reviews"], 90),
              ("Issues", issues, percentages["Issues"], 180),
          ]

          max_value = max(value for _, value, _, _ in axes)

          if max_value == 0:
              max_value = 1

          def point(radius, angle_degrees):
              angle = math.radians(angle_degrees)

              x = center_x + math.cos(angle) * radius
              y = center_y + math.sin(angle) * radius

              return x, y

          # -----------------------------
          # Background radar rings
          # -----------------------------

          rings = []

          for level in [0.25, 0.50, 0.75, 1.0]:
              radius = outer_radius * level

              points = [
                  point(radius, -90),
                  point(radius, 0),
                  point(radius, 90),
                  point(radius, 180),
              ]

              rings.append(
                  '<polygon points="'
                  + " ".join(
                      f"{x:.1f},{y:.1f}"
                      for x, y in points
                  )
                  + '" fill="none" stroke="#30363d" stroke-width="1"/>'
              )

          # -----------------------------
          # Axis lines
          # -----------------------------

          axis_lines = []

          for _, _, _, angle in axes:
              x, y = point(outer_radius, angle)

              axis_lines.append(
                  f'<line '
                  f'x1="{center_x}" '
                  f'y1="{center_y}" '
                  f'x2="{x:.1f}" '
                  f'y2="{y:.1f}" '
                  f'stroke="#30363d" '
                  f'stroke-width="1"/>'
              )

          # -----------------------------
          # Data polygon
          # -----------------------------

          data_points = []

          for _, value, _, angle in axes:
              ratio = value / max_value

              radius = max(
                  inner_radius,
                  outer_radius * ratio
              )

              x, y = point(radius, angle)

              data_points.append((x, y))

          polygon_points = " ".join(
              f"{x:.1f},{y:.1f}"
              for x, y in data_points
          )

          # -----------------------------
          # Data points
          # -----------------------------

          dots = []

          for x, y in data_points:
              dots.append(
                  f'<circle '
                  f'cx="{x:.1f}" '
                  f'cy="{y:.1f}" '
                  f'r="5" '
                  f'fill="#58a6ff" '
                  f'stroke="#0d1117" '
                  f'stroke-width="2"/>'
              )

          # -----------------------------
          # Labels
          # -----------------------------

          labels = []

          label_positions = {
              "Commits": (0, -220),
              "Pull Requests": (215, 0),
              "Code Reviews": (0, 225),
              "Issues": (-215, 0),
          }

          text_anchor = {
              "Commits": "middle",
              "Pull Requests": "start",
              "Code Reviews": "middle",
              "Issues": "end",
          }

          for name, value, percentage, _ in axes:

              dx, dy = label_positions[name]

              labels.append(
                  f'<text '
                  f'x="{center_x + dx}" '
                  f'y="{center_y + dy}" '
                  f'fill="#e6edf3" '
                  f'font-family="Arial, Helvetica, sans-serif" '
                  f'font-size="18" '
                  f'font-weight="600" '
                  f'text-anchor="{text_anchor[name]}">'
                  f'{name}'
                  f'</text>'
              )

              labels.append(
                  f'<text '
                  f'x="{center_x + dx}" '
                  f'y="{center_y + dy + 23}" '
                  f'fill="#8b949e" '
                  f'font-family="Arial, Helvetica, sans-serif" '
                  f'font-size="14" '
                  f'text-anchor="{text_anchor[name]}">'
                  f'{value} · {percentage}%'
                  f'</text>'
              )

          # -----------------------------
          # Final SVG
          # -----------------------------

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="{width}"
          height="{height}"
          viewBox="0 0 {width} {height}">

            <rect
              width="100%"
              height="100%"
              fill="#0d1117"/>

            <text
              x="450"
              y="45"
              fill="#f0f6fc"
              font-family="Arial, Helvetica, sans-serif"
              font-size="24"
              font-weight="700"
              text-anchor="middle">
              GitHub Activity
            </text>

            <text
              x="450"
              y="70"
              fill="#8b949e"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
              text-anchor="middle">
              Contribution breakdown · last year
            </text>

            {"".join(rings)}

            {"".join(axis_lines)}

            <polygon
              points="{polygon_points}"
              fill="#58a6ff"
              fill-opacity="0.18"
              stroke="#58a6ff"
              stroke-width="3"/>

            {"".join(dots)}

            {"".join(labels)}

            <circle
              cx="{center_x}"
              cy="{center_y}"
              r="4"
              fill="#58a6ff"/>

          </svg>
          '''

          output = Path("assets/github-activity-radar.svg")

          output.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Generated {output}"
          )
          PY

      - name: Commit radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-activity-radar.svg

          if git diff --cached --quiet; then
            echo "Radar is already up to date."
            exit 0
          fi

          git commit -m "chore: update GitHub activity radar"
          git push
