name: Update Profile Banner

on:
  schedule:
    # Check every hour at 7 minutes past the hour.
    - cron: "7 * * * *"

  # Lets you run the workflow manually.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select banner URL
        env:
          TZ: Asia/Kolkata
        run: |
          set -e

          HOUR=$(date +%H)
          DAY=$(date +%A | tr '[:upper:]' '[:lower:]')

          case "$DAY" in

            monday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/toXKzaJP3WIgM/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/5Zesu5VPNGJlm/giphy.gif"
              fi
              ;;

            tuesday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/ZVEAsN6eaznz4FqGt8/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/dMT2l2MKURkeXSOART/giphy.gif"
              fi
              ;;

            wednesday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/px8O7NANzzaqk/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/S2IfEQqgWc0AH4r6Al/giphy.gif"
              fi
              ;;

            thursday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/brHaCdJqCXijm/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/h8HmN0UcEKR0xWnv3R/giphy.gif"
              fi
              ;;

            friday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/JAnYmCykt41OYw1HJG/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/blSTtZehjAZ8I/giphy.gif"
              fi
              ;;

            saturday)
              BANNER_URL="https://media.giphy.com/media/GG2UAv9uRblny/giphy.gif"
              ;;

            sunday)
              BANNER_URL="https://media.giphy.com/media/d2ItDZZumUI6Y/giphy.gif"
              ;;

            *)
              echo "Unknown day"
              exit 1
              ;;
          esac

          echo "Selected banner: $BANNER_URL"

          python <<'PY'
          import os
          import re

          path = "README.md"
          banner_url = os.environ["BANNER_URL"]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          new_banner = (
              f'<img src="{banner_url}" '
              f'width="100%" alt="Animesh\'s banner" />'
          )

          pattern = r'<img src="[^"]+" width="100%" alt="Animesh\'s banner" />'

          updated, count = re.subn(pattern, new_banner, content, count=1)

          if count == 0:
              raise SystemExit("Banner image line not found in README.md")

          with open(path, "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit banner change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No banner change."
            exit 0
          fi

          git commit -m "chore: update profile banner"
          git push
