name: Update Profile Banner

on:
  schedule:
    # Check every hour.
    - cron: "7 * * * *"

  # Allows manual testing from Actions.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select the correct GIPHY banner
        env:
          TZ: Asia/Kolkata
        run: |
          set -e

          HOUR=$(date +%H)
          DAY=$(date +%A | tr '[:upper:]' '[:lower:]')

          echo "Current India time: $(date)"
          echo "Day: $DAY"
          echo "Hour: $HOUR"

          case "$DAY" in

            monday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/toXKzaJP3WIgM/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/5Zesu5VPNGJlm/giphy.gif"
              fi
              ;;

            tuesday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/ZVEAsN6eaznz4FqGt8/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/dMT2l2MKURkeXSOART/giphy.gif"
              fi
              ;;

            wednesday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/px8O7NANzzaqk/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/S2IfEQqgWc0AH4r6Al/giphy.gif"
              fi
              ;;

            thursday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/brHaCdJqCXijm/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/h8HmN0UcEKR0xWnv3R/giphy.gif"
              fi
              ;;

            friday)
              if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 23 ]; then
                BANNER_URL="https://media.giphy.com/media/JAnYmCykt41OYw1HJG/giphy.gif"
              else
                BANNER_URL="https://media.giphy.com/media/blSTtZehjAZ8I/giphy.gif"
              fi
              ;;

            saturday)
              BANNER_URL="https://media.giphy.com/media/GG2UAv9uRblny/giphy.gif"
              ;;

            sunday)
              BANNER_URL="https://media.giphy.com/media/d2ItDZZumUI6Y/giphy.gif"
              ;;

            *)
              echo "Unknown day: $DAY"
              exit 1
              ;;
          esac

          echo "Selected banner:"
          echo "$BANNER_URL"

          export BANNER_URL

          python <<'PY'
          import os
          import re
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          banner_url = os.environ["BANNER_URL"]

          pattern = (
              r'<img\s+'
              r'src="[^"]+"\s+'
              r'width="100%"\s+'
              r'alt="[^"]*"\s*/>'
          )

          replacement = (
              f'<img src="{banner_url}" '
              f'width="100%" '
              f'alt="Animesh\'s banner" />'
          )

          updated, count = re.subn(
              pattern,
              replacement,
              content,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Could not find the banner image in README.md"
              )

          if updated == content:
              print("Banner is already correct. No change needed.")
          else:
              readme.write_text(updated, encoding="utf-8")
              print("README.md banner updated successfully.")
          PY

      - name: Commit banner update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No banner change. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: update profile banner"
          git push
