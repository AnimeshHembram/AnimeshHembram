name: Update Profile Banner

on:
  schedule:
    # Avengers: Doomsday campaign, 2026-11-20 to 2026-12-19.
    - cron: "30 0 * * *"   # 06:00 AM IST
    - cron: "30 12 * * *"  # 06:00 PM IST

  # Allows manual testing from Actions.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select the correct GIPHY banner
        env:
          TZ: Asia/Kolkata
        run: |
          set -e

          # Avengers: Doomsday GIFs (numbered 1-23).
          GIFS=(
            "https://media.giphy.com/media/NWyOqVyZNkS706WMoc/giphy.gif"
            "https://media.giphy.com/media/5q8O1elv6RKMIyffAP/giphy.gif"
            "https://media.giphy.com/media/KT00yvFMOriW8k99KU/giphy.gif"
            "https://media.giphy.com/media/LAl7xB5uCxmp4cj7Vl/giphy.gif"
            "https://media.giphy.com/media/ABRl16KQ6Zqyrqjx1G/giphy.gif"
            "https://media.giphy.com/media/Dp6bDZ45oKIlalcaX4/giphy.gif"
            "https://media.giphy.com/media/naKOXYjz7jeRdVVW4D/giphy.gif"
            "https://media.giphy.com/media/ihBiHNvd9e5ti3PNUR/giphy.gif"
            "https://media.giphy.com/media/QQJUsYyLR1Snvhln91/giphy.gif"
            "https://media.giphy.com/media/1cRIumg5R0Ld66VxFi/giphy.gif"
            "https://media.giphy.com/media/i8VcoswCVfTGRAKNhe/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3ZmRieWxpaTdta3N5aXUxaHpnMzd6Y2oxcmZjOWJpNGVmMGZ3ZGNjcyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/nGwpiqxMtYbDO/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3Z29hNHgzaHRkeWFqbjVnMTkzcjR2dHA3eWdneng4amZzYmtjbXFqMiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Pja8Ied6v7M7Gq5DeK/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3bXlzZGQyYXBsemd3dGd3ODdlNHBxdzQ5dXV4em1kZjBmNjVkZGhsOCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/8xomIW1DRelmo/giphy.gif"
            "https://media.giphy.com/media/FILk3kWDTFczBtDmRs/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3hlcWpqNjJwdTh0ZXd2Y3ZnNm1xZ3MyOHpkYnpjajBqbmF6ZXNhMiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/wlOau1cjQyweM6OSII/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3N2ticzJ4cW96cmN5MXI0ZmMxOGgwZXg5cHpuc2pvc20zMzM3ZnkybCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3brdG6OLETYnm/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3MW9tdDVhNWh6dTN0M21icWRhNm9kOGRidHlybGo4dTA1NTF6eTU0cyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3ov9jOjo4n7HASUu8U/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3c2Z0NmZuYTY3bmp5OHNtZXYwOW1oaDNpYzVpOGlpcWU1ZWg2dzg5cCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/25RMCYnFKmiCzMFTGd/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3Nm9jejB1aG1meTdncmcyYW41bm5lY2dlbzZra3d4d2hueXo3dXBycCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/UYzSmRaDu5eVpbvZqw/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3ZHp5MGZvMGV6bXJhejd1Mnc3Y3k5cTM0Y29zbHV2NXB6OHFqdG9vZCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/dJo9h2zrdANo1GO3pd/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeHF2MGl2OGs5bWozc2dkcHQycnFxdmtqeXhrcHkyZzFmbTg3aWR6NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/MMiwnuJfzLrPTgyWIC/giphy.gif"
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3bXE2dm85ZTJiZXgwYTFtcGUwZWU0NzBzdnlocTF0Z2drd3NucDJsZiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/emR6Upn5la4hO/giphy.gif"
          )

          # Fixed shuffled order for the 60 slots (30 days x morning/night).
          # Each line of 23 uses every GIF once; the last line adds 14 more.
          # No GIF appears twice in a row. Fixed order = reruns pick the same GIF.
          ORDER=(
            17 1 8 7 5 10 20 23 3 19 21 11 2 18 13 12 22 15 9 6 16 4 14
            5 11 21 8 17 15 23 22 18 2 6 14 13 7 4 10 20 3 19 16 1 9 12
            18 4 6 20 5 16 1 19 11 12 17 15 14 7
          )

          # Slot 0 starts 2026-11-20 06:00 IST; each slot lasts 12 hours.
          # A late-starting run still lands in the correct slot.
          START=$(date -d "2026-11-20 06:00" +%s)
          NOW=$(date -d "${BANNER_TIME:-now}" +%s)

          echo "Current India time: $(date -d "@$NOW")"

          if [ "$NOW" -lt "$START" ]; then
            echo "Campaign has not started yet. README left unchanged."
            exit 0
          fi

          SLOT=$(( (NOW - START) / 43200 ))

          if [ "$SLOT" -ge "${#ORDER[@]}" ]; then
            echo "Campaign ended after 2026-12-19. README left unchanged."
            exit 0
          fi

          GIF_NUMBER=${ORDER[$SLOT]}
          BANNER_URL=${GIFS[$((GIF_NUMBER - 1))]}

          echo "Slot: $((SLOT + 1)) of ${#ORDER[@]}"
          echo "Selected banner (GIF #$GIF_NUMBER):"
          echo "$BANNER_URL"

          export BANNER_URL

          python <<'PY'
          import os
          import re
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          banner_url = os.environ["BANNER_URL"]

          # Replace only the src of the <img> between the Marvel markers.
          pattern = (
              r'(<!-- MARVEL_BANNER_START -->.*?<img\b[^>]*?\bsrc\s*=\s*["\'])'
              r'[^"\']+'
              r'(["\'][^>]*>.*?<!-- MARVEL_BANNER_END -->)'
          )

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + banner_url + m.group(2),
              content,
              count=1,
              flags=re.DOTALL
          )

          if count != 1:
              raise SystemExit(
                  "Could not find the banner image between "
                  "MARVEL_BANNER_START and MARVEL_BANNER_END in README.md"
              )

          if updated == content:
              print("Banner is already correct. No change needed.")
          else:
              readme.write_text(updated, encoding="utf-8")
              print("README.md banner updated successfully.")
          PY

      - name: Commit banner update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No banner change. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: update profile banner"
          git push
