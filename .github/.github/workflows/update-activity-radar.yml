name: Update GitHub Activity Radar

on:
  schedule:
    # Update once every day.
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity radar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: AnimeshHembram
        run: |
          set -e

          mkdir -p assets

          python3 <<'PY'
          import json
          import math
          import os
          import subprocess
          from pathlib import Path

          username = os.environ["USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
              }
            }
          }
          """

          variables = json.dumps({"login": username})

          result = subprocess.run(
              [
                  "curl",
                  "-sS",
                  "-X",
                  "POST",
                  "https://api.github.com/graphql",
                  "-H",
                  "Authorization: bearer " + os.environ["GH_TOKEN"],
                  "-H",
                  "Content-Type: application/json",
                  "-d",
                  json.dumps({
                      "query": query,
                      "variables": json.loads(variables)
                  })
              ],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)

          if "errors" in data:
              raise SystemExit(
                  "GitHub GraphQL error: " +
                  json.dumps(data["errors"])
              )

          contributions = data["data"]["user"]["contributionsCollection"]

          commits = contributions["totalCommitContributions"]
          issues = contributions["totalIssueContributions"]
          pull_requests = contributions["totalPullRequestContributions"]
          reviews = contributions["totalPullRequestReviewContributions"]

          values = {
              "Commits": commits,
              "Pull Requests": pull_requests,
              "Code Reviews": reviews,
              "Issues": issues,
          }

          print("GitHub activity:")
          for key, value in values.items():
              print(f"  {key}: {value}")

          total = sum(values.values())

          if total == 0:
              percentages = {key: 0 for key in values}
          else:
              percentages = {
                  key: round((value / total) * 100)
                  for key, value in values.items()
              }

          # Radar configuration
          width = 900
          height = 560

          center_x = 450
          center_y = 255

          outer_radius = 175
          inner_radius = 36

          # Order around the radar:
          # top -> right -> bottom -> left
          axes = [
              ("Commits", values["Commits"], percentages["Commits"], -90),
              ("Pull Requests", values["Pull Requests"], percentages["Pull Requests"], 0),
              ("Code Reviews", values["Code Reviews"], percentages["Code Reviews"], 90),
              ("Issues", values["Issues"], percentages["Issues"], 180),
          ]

          max_value = max(item[1] for item in axes)

          if max_value == 0:
              max_value = 1

          def point(radius, angle_degrees):
              angle = math.radians(angle_degrees)
              x = center_x + math.cos(angle) * radius
              y = center_y + math.sin(angle) * radius
              return x, y

          # Background rings
          rings = []

          for level in [0.25, 0.50, 0.75, 1.0]:
              radius = outer_radius * level

              points = [
                  point(radius, -90),
                  point(radius, 0),
                  point(radius, 90),
                  point(radius, 180),
              ]

              rings.append(
                  '<polygon points="'
                  + " ".join(f"{x:.1f},{y:.1f}" for x, y in points)
                  + '" fill="none" stroke="#2d333b" stroke-width="1"/>'
              )

          # Axis lines
          axis_lines = []

          for _, _, _, angle in axes:
              x, y = point(outer_radius, angle)

              axis_lines.append(
                  f'<line x1="{center_x}" y1="{center_y}" '
                  f'x2="{x:.1f}" y2="{y:.1f}" '
                  f'stroke="#30363d" stroke-width="1"/>'
              )

          # Data polygon
          data_points = []

          for _, value, _, angle in axes:
              ratio = value / max_value
              radius = max(inner_radius, outer_radius * ratio)

              x, y = point(radius, angle)
              data_points.append((x, y))

          polygon_points = " ".join(
              f"{x:.1f},{y:.1f}" for x, y in data_points
          )

          # Data points
          dots = []

          for x, y in data_points:
              dots.append(
                  f'<circle cx="{x:.1f}" cy="{y:.1f}" r="5" '
                  f'fill="#58a6ff" stroke="#0d1117" stroke-width="2"/>'
              )

          # Labels
          labels = []

          label_positions = {
              "Commits": (-0, -outer_radius - 30),
              "Pull Requests": (outer_radius + 42, 2),
              "Code Reviews": (0, outer_radius + 55),
              "Issues": (-outer_radius - 42, 2),
          }

          text_anchor = {
              "Commits": "middle",
              "Pull Requests": "start",
              "Code Reviews": "middle",
              "Issues": "end",
          }

          for name, value, percentage, _ in axes:
              dx, dy = label_positions[name]

              labels.append(
                  f'<text x="{center_x + dx}" '
                  f'y="{center_y + dy}" '
                  f'fill="#e6edf3" '
                  f'font-family="Arial, Helvetica, sans-serif" '
                  f'font-size="18" '
                  f'font-weight="600" '
                  f'text-anchor="{text_anchor[name]}">'
                  f'{name}</text>'
              )

              value_y = center_y + dy + 23

              labels.append(
                  f'<text x="{center_x + dx}" '
                  f'y="{value_y}" '
                  f'fill="#8b949e" '
                  f'font-family="Arial, Helvetica, sans-serif" '
                  f'font-size="14" '
                  f'text-anchor="{text_anchor[name]}">'
                  f'{value} · {percentage}%</text>'
              )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="{width}" height="{height}" viewBox="0 0 {width} {height}">
            <rect width="100%" height="100%" fill="#0d1117"/>

            <text x="450" y="42"
                  fill="#f0f6fc"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="24"
                  font-weight="700"
                  text-anchor="middle">
              GitHub Activity
            </text>

            <text x="450" y="68"
                  fill="#8b949e"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="14"
                  text-anchor="middle">
              Contribution breakdown · last year
            </text>

            {"".join(rings)}
            {"".join(axis_lines)}

            <polygon points="{polygon_points}"
                     fill="#58a6ff"
                     fill-opacity="0.18"
                     stroke="#58a6ff"
                     stroke-width="3"/>

            {"".join(dots)}
            {"".join(labels)}

            <circle cx="{center_x}"
                    cy="{center_y}"
                    r="4"
                    fill="#58a6ff"/>
          </svg>
          '''

          output = Path("assets/github-activity-radar.svg")
          output.write_text(svg, encoding="utf-8")

          print(f"Generated {output}")
          PY

      - name: Commit radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-activity-radar.svg

          if git diff --cached --quiet; then
            echo "Radar is already up to date."
            exit 0
          fi

          git commit -m "chore: update GitHub activity radar"
          git push
